# PostgreSQL local para desenvolvimento (opcional): docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medico
      POSTGRES_PASSWORD: medico
      POSTGRES_DB: medico_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
