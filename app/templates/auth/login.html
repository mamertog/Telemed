{% extends "auth/base_auth.html" %}
{% from "_macros.html" import field with context %}
{% block title %}Entrar{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Entrar no painel</h1>
<form method="post" novalidate>
  {{ form.csrf_token }}
  {{ field(form.email) }}
  {{ field(form.password) }}
  <button class="btn btn-primary w-100">{{ icon('lock') }} Entrar</button>
</form>
<p class="small mt-3 mb-0"><a href="{{ url_for('auth.forgot') }}">Esqueci minha senha</a></p>
{% endblock %}
